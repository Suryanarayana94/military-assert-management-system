databases:
  - name: sentinel-postgres
    databaseName: sentinel
    user: sentinel
    plan: free

services:
  - type: web
    name: sentinel-asset-api
    runtime: node
    buildCommand: npm ci && npm run prisma:generate -w backend && npm run prisma:push -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
