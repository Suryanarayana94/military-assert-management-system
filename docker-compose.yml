services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: sh -c "npm run prisma:push -w backend && npm run start -w backend"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel?schema=public
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sentinel-postgres:
